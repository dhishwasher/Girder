[package]
name = "aether-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Off by default so the workspace builds and the demo runs with no network /
# API keys. Turning this on compiles the real HTTP-backed OpenAI and Anthropic
# providers.
default = []
live-providers = ["dep:reqwest"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# Live HTTP client (rustls so there's no OpenSSL system dependency).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
