[package]
name = "aether-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bitcode"
path = "src/main.rs"

[features]
# GUI is OFF by default so `cargo build/run` works in headless/CI environments
# without a display, GPU, or windowing system libraries. The default binary runs
# the `--headless` smoke demo, which exercises every subsystem over stdout.
# Enable the real egui/wgpu window with `--features gui`.
default = []
gui = ["dep:eframe", "dep:egui"]
# Opt in to the real HTTP-backed OpenAI and Anthropic providers. With this
# enabled, configured API keys let the router use live models before falling
# back to the offline mock.
live-providers = ["aether-ai/live-providers"]

[dependencies]
aether-graph = { workspace = true }
aether-builder = { workspace = true }
aether-ai = { workspace = true }
aether-agents = { workspace = true }
aether-debugger = { workspace = true }
aether-dap = { workspace = true }
aether-extensions = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
globset = { workspace = true }
libc = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
ring = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
