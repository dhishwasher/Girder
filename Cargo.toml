[workspace]
resolver = "2"
members = [
    "crates/aether-graph",
    "crates/aether-builder",
    "crates/aether-ai",
    "crates/aether-agents",
    "crates/aether-debugger",
    "crates/aether-dap",
    "crates/aether-extensions",
    "crates/aether-app",
]

[workspace.package]
version = "0.2.3"
edition = "2021"
license-file = "LICENSE"
publish = false
authors = ["Cory Robert Maynard"]
repository = "https://github.com/dhishwasher/Girder"

# Shared dependency versions. Individual crates opt in via `workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
ignore = "0.4.33"
libc = "0.2"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
ring = "0.17"
ron = "0.8"
bincode = "1.3"
thiserror = "1"
anyhow = "1"
arboard = "3.6.1"
petgraph = { version = "0.6", features = ["serde-1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
rayon = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Parsing
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-typescript = "0.21.2"
tree-sitter-go = "0.21.2"
# UI. GPU-accelerated egui via wgpu, with the Linux windowing backends enabled.
# CI type-checks the `gui` feature on stable Rust. Running the window still needs
# a GPU or software Vulkan adapter plus the usual platform windowing libraries.
eframe = { version = "0.31", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.31"
# Internal crates
aether-graph = { path = "crates/aether-graph" }
aether-builder = { path = "crates/aether-builder" }
aether-ai = { path = "crates/aether-ai" }
aether-agents = { path = "crates/aether-agents" }
aether-debugger = { path = "crates/aether-debugger" }
aether-dap = { path = "crates/aether-dap" }
aether-extensions = { path = "crates/aether-extensions" }

# Faster, leaner release builds.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
