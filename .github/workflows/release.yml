# Prebuilt binaries for a tagged release.
#
# Until this existed, installing Girder meant cloning the repository and
# compiling it, which requires a Rust toolchain. That is a hard stop for most
# of the people who would use `girder mcp` from a coding agent, since the
# agent hosts (Claude Code, Cursor, Codex, Zed) are not Rust environments.
#
# Triggered by pushing a `v*` tag, or manually against any ref for a dry run.
# The manual path builds and uploads workflow artifacts but publishes no
# release, so the pipeline can be proven before a real version is cut.
#
# A dry run only proves the four build jobs. To exercise packaging and the
# release upload as well, push a candidate tag — `v0.1.0-rc.1` — which marks
# the GitHub release as a prerelease and skips npm. Once it is green, the real
# tag runs the identical path with nothing left unproven.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default. Only `publish` creates a release, and it
# raises its own scope; the four build jobs never need to write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs before anything is built, because a version disagreement is fatal in
  # a way that is invisible after the fact: npm/install.js derives its download
  # URL from package.json's own version, so a package published as 0.1.0 from a
  # v0.2.0 tag would fetch the wrong release's binaries — or 404 — on every
  # install, while the release itself looks fine.
  preflight:
    name: Versions agree
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.versions.outputs.prerelease }}
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag against the source versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          npm_version="$(python3 -c 'import json; print(json.load(open("npm/package.json"))["version"])')"
          server_version="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          server_pkg_version="$(python3 -c 'import json; print(json.load(open("server.json"))["packages"][0]["version"])')"
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml:              $cargo_version"
          echo "npm/package.json:        $npm_version"
          echo "server.json:             $server_version"
          echo "server.json package:     $server_pkg_version"

          failed=""
          if [ "$cargo_version" != "$npm_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and npm/package.json ($npm_version) disagree"
            failed=1
          fi

          # server.json carries the version twice — once for the server record
          # and once for the npm package it points at. The registry resolves
          # the package version against npm, so a stale entry here does not
          # fail loudly: it silently registers the previous release, or 404s
          # against a version that was never published.
          if [ "$cargo_version" != "$server_version" ]; then
            echo "::error::server.json version ($server_version) does not match Cargo.toml ($cargo_version)"
            failed=1
          fi
          if [ "$cargo_version" != "$server_pkg_version" ]; then
            echo "::error::server.json packages[0].version ($server_pkg_version) does not match Cargo.toml ($cargo_version)"
            failed=1
          fi

          # The registry proves ownership by comparing server.json's name
          # against the mcpName published in the npm tarball, and resolves the
          # package by identifier. Either mismatch is rejected at publish time,
          # after the release is already public, so check both here instead.
          server_name="$(python3 -c 'import json; print(json.load(open("server.json"))["name"])')"
          mcp_name="$(python3 -c 'import json; print(json.load(open("npm/package.json")).get("mcpName",""))')"
          pkg_identifier="$(python3 -c 'import json; print(json.load(open("server.json"))["packages"][0]["identifier"])')"
          pkg_name="$(python3 -c 'import json; print(json.load(open("npm/package.json"))["name"])')"
          echo "server.json name:        $server_name"
          echo "npm mcpName:             ${mcp_name:-<missing>}"
          if [ -z "$mcp_name" ]; then
            echo "::error::npm/package.json is missing the mcpName field; the MCP registry cannot verify ownership without it"
            failed=1
          elif [ "$server_name" != "$mcp_name" ]; then
            echo "::error::server.json name ($server_name) and npm mcpName ($mcp_name) disagree"
            failed=1
          fi
          if [ "$pkg_identifier" != "$pkg_name" ]; then
            echo "::error::server.json packages[0].identifier ($pkg_identifier) is not the npm package name ($pkg_name)"
            failed=1
          fi

          # A manual dry run has no version to compare against, so only the
          # two source files are checked in that case.
          prerelease=false
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag_version="${GITHUB_REF#refs/tags/v}"
              # A release candidate carries a suffix: v0.1.0-rc.1. Only the
              # part before it is compared, so an rc still cannot drift from
              # the version it is a candidate for.
              core_version="${tag_version%%-*}"
              if [ "$core_version" != "$tag_version" ]; then
                prerelease=true
              fi
              echo "tag:              $tag_version (version $core_version, prerelease $prerelease)"
              if [ "$core_version" != "$cargo_version" ]; then
                echo "::error::tag v$tag_version does not match the source version $cargo_version"
                failed=1
              fi
              ;;
            *)
              echo "not a tag; skipping the tag comparison"
              ;;
          esac

          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ]

  build:
    name: ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      # One target failing should not hide whether the others are fine.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure NSIS is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $nsisExe = if ($nsis) { $nsis.Source } else {
            Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          }
          if (-not (Test-Path -LiteralPath $nsisExe -PathType Leaf)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "NSIS installation failed with exit code $LASTEXITCODE"
            }
          }
          if (-not (Test-Path -LiteralPath $nsisExe -PathType Leaf)) {
            throw "makensis is unavailable at $nsisExe after installing NSIS"
          }
          # Installation does not update this process's PATH. Use the resolved
          # executable now and expose its directory to later steps via GITHUB_PATH.
          Split-Path -Parent $nsisExe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nsisExe /VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "makensis version check failed with exit code $LASTEXITCODE"
          }

      - name: Verify NSIS on the packaging PATH
        if: runner.os == 'Windows'
        shell: bash
        run: command -v makensis

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build release binary
        # Default features only: the headless CLI and the MCP server. The GUI
        # needs system graphics libraries and is not what a released binary is
        # for; live providers are an opt-in rebuild.
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}

      # `macos-latest` is Apple Silicon, so the Intel artifact is
      # cross-compiled here and cannot execute without Rosetta 2 — which is
      # not pre-installed on GitHub's arm64 macOS runners. Without this the
      # verification step below dies with "bad CPU type in executable" and
      # takes the whole release with it. The install is idempotent, and the
      # arch test keeps this correct if the runner label ever points at an
      # Intel image again.
      - name: Install Rosetta 2 to run the Intel artifact
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            softwareupdate --install-rosetta --agree-to-license
          else
            echo "native x86_64 host; Rosetta is not needed"
          fi

      # A binary that cannot answer `--version` is not shippable, and a
      # release that silently ships a broken MCP handshake is worse than no
      # release. Both are cheap to check here, on the exact artifact.
      - name: Verify the artifact runs (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/girder"
          # Decide runnability from the artifact's arch against the host's,
          # rather than from a hardcoded triple. The previous check named
          # only `aarch64-apple-darwin` on an x86 host, which is the case
          # that stopped happening when `macos-latest` became Apple
          # Silicon, and missed the one that started: an Intel artifact on
          # an arm64 host, which needs the Rosetta installed above.
          case "$(uname -m)" in
            arm64 | aarch64) host_arch="arm64" ;;
            *) host_arch="x86_64" ;;
          esac
          case "${{ matrix.target }}" in
            aarch64-*) target_arch="arm64" ;;
            *) target_arch="x86_64" ;;
          esac
          # The only translation this workflow provides is Rosetta, which is
          # macOS-only. Any other mismatch is skipped rather than failed,
          # because a release should not die over the runner's architecture
          # when the artifact itself is fine.
          if [ "$target_arch" != "$host_arch" ] &&
             ! { [ "$(uname -s)" = "Darwin" ] && [ "$target_arch" = "x86_64" ]; }; then
            echo "skipping execution check: $target_arch artifact on a $host_arch $(uname -s) host"
            exit 0
          fi
          "$BIN" --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            | "$BIN" mcp . > handshake.json
          grep -q '"serverInfo"' handshake.json
          grep -q '"protocolVersion":"2025-06-18"' handshake.json

      - name: Verify Linux artifact has no glibc dependency
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/girder"
          if readelf -l "$BIN" | grep -q 'Requesting program interpreter'; then
            echo "::error::Linux release is dynamically linked and may depend on the build host's glibc"
            exit 1
          fi

      - name: Verify the artifact runs (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/girder.exe"
          "$BIN" --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            | "$BIN" mcp . > handshake.json
          grep -q '"serverInfo"' handshake.json

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          name="girder-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/girder.exe" .
            7z a "dist/${name}.zip" girder.exe LICENSE README.md
          else
            cp "target/${{ matrix.target }}/release/girder" .
            tar czf "dist/${name}.tar.gz" girder LICENSE README.md
          fi

      # The archives above retain their headless CLI. The desktop installer
      # additionally needs the GUI compiled into its binary.
      - name: Build Windows desktop binary
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p aether-app --features gui --target ${{ matrix.target }}

      - name: Build per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $repoRoot = (Get-Location).Path
          $version = "${{ needs.preflight.outputs.version }}"
          $binary = Join-Path $repoRoot 'target\${{ matrix.target }}\release\girder.exe'
          $icon = Join-Path $repoRoot 'assets\icon.ico'
          $license = Join-Path $repoRoot 'LICENSE'
          $fontLicense = Join-Path $repoRoot 'assets\fonts\DejaVuSansMono-LICENSE.txt'
          $installer = Join-Path $repoRoot "dist\Girder-$version-setup.exe"
          $script = Join-Path $repoRoot 'packaging\windows\Girder.nsi'

          foreach ($inputPath in @($binary, $icon, $license, $fontLicense, $script)) {
            if (-not (Test-Path -LiteralPath $inputPath -PathType Leaf)) {
              throw "installer input is missing: $inputPath"
            }
          }

          & makensis.exe "/DVERSION=$version" "/DBINARY_PATH=$binary" "/DICON_PATH=$icon" `
            "/DLICENSE_PATH=$license" "/DFONT_LICENSE_PATH=$fontLicense" `
            "/DOUTPUT_PATH=$installer" $script
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "installer was not produced: $installer"
          }
          Write-Output "produced $installer"

      # Checksums are generated per target rather than centrally so each one
      # is computed on the machine that produced the artifact.
      - name: Checksum
        shell: bash
        run: |
          cd dist
          for file in *; do
            if command -v sha256sum > /dev/null; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: girder-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    # The only job that writes: creating the release and uploading assets.
    permissions:
      contents: write
    # Only a real tag publishes. A manual run stops after build, so the
    # pipeline can be exercised without creating a release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}

  # Strictly after the release exists: the package's postinstall downloads the
  # binaries from it, so publishing to npm first would ship a version that
  # cannot install until the release catches up.
  #
  # Skipped for a release candidate. npm/install.js derives its download URL
  # from package.json's own version, so a package cut from v0.1.0-rc.1 would
  # look for the v0.1.0 assets, which do not exist yet. A candidate is for
  # proving the binary pipeline; npm publishes only on the real tag.
  npm:
    name: Publish to npm
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.preflight.outputs.prerelease != 'true'
    permissions:
      contents: read
      # The npm trusted publisher for dhishwasher/Girder/release.yml validates
      # this workflow's short-lived GitHub OIDC identity. It also generates
      # provenance for the public package automatically.
      id-token: write
    outputs:
      # The registry job keys off the completed publish step rather than
      # attempting to register a version that npm has not accepted.
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Do not pass setup-node's registry-url here. In v6 it writes an
      # _authToken=${NODE_AUTH_TOKEN} entry that prevents npm from initiating
      # trusted-publisher OIDC when NODE_AUTH_TOKEN is correctly absent.
      - name: Install an OIDC-capable npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@latest
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const actual = process.argv[2].split(".").map(Number);
          const minimum = [11, 5, 1];
          if (actual.length < 3 || actual.some((part) => !Number.isInteger(part))) {
            throw new Error(`cannot parse npm version ${process.argv[2]}`);
          }
          let comparison = 0;
          for (let index = 0; index < minimum.length; index += 1) {
            if (actual[index] !== minimum[index]) {
              comparison = actual[index] > minimum[index] ? 1 : -1;
              break;
            }
          }
          if (comparison < 0) {
            throw new Error(`npm ${process.argv[2]} is below the OIDC minimum 11.5.1`);
          }
          NODE
          echo "npm $npm_version supports trusted publishing"

      - name: Wrapper unit tests
        run: node --test npm/test/*.test.js

      # `preflight` only compares two text files (Cargo.toml and
      # package.json) — it cannot see whether the binary actually built and
      # published under those version numbers agrees with them. That gap is
      # exactly how a real drift would ship silently: the source and the
      # package manifest could match each other while the artifact a user's
      # `npx` downloads reports something else. Downloading the real,
      # just-published release asset (not a local build) and running
      # `--version` on it is what closes that: it is the same file
      # npm/install.js will hand to every installer.
      - name: Verify the published artifact's version, not just the source files
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          npm_version="$(python3 -c 'import json; print(json.load(open("npm/package.json"))["version"])')"

          tag="${GITHUB_REF#refs/tags/}"
          asset="girder-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/${{ github.repository }}/releases/download/${tag}/${asset}"

          scratch="$(mktemp -d)"
          curl -fsSL -o "$scratch/$asset" "$url"
          tar -xf "$scratch/$asset" -C "$scratch"
          chmod +x "$scratch/girder"

          artifact_version="$("$scratch/girder" --version | awk '{print $2}')"

          echo "Cargo.toml:                 $cargo_version"
          echo "npm/package.json:           $npm_version"
          echo "downloaded release artifact: $artifact_version"

          failed=""
          if [ "$cargo_version" != "$npm_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and npm/package.json ($npm_version) disagree"
            failed=1
          fi
          if [ "$cargo_version" != "$artifact_version" ]; then
            echo "::error::the published release artifact reports version $artifact_version, which does not match Cargo.toml/npm ($cargo_version). Publishing to npm now would ship a version string that lies about which binary a user actually got."
            failed=1
          fi
          [ -z "$failed" ]

      - name: Publish
        id: publish
        working-directory: npm
        run: |
          set -euo pipefail
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

  # Registering the server is the last step for a reason: the registry does not
  # take our word for the package's existence. It fetches
  # registry.npmjs.org/<pkg>/<version> and compares the mcpName recorded there
  # against server.json's name. So this cannot run until the npm job has
  # actually published. A missing or mismatched npm trusted-publisher
  # configuration fails the npm job before this registry job can start.
  mcp-registry:
    name: Publish to MCP Registry
    needs: [preflight, npm]
    runs-on: ubuntu-latest
    if: needs.npm.outputs.published == 'true'
    permissions:
      # OIDC: the registry trusts a GitHub-signed token proving this workflow
      # runs in dhishwasher/Girder, which is what grants the
      # io.github.dhishwasher/* namespace. No secret to store or rotate.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      # npm's version endpoint lags a successful `npm publish` by a few seconds
      # to a few minutes. The registry treats that lag as a hard 404 and fails
      # the publish, so wait for the exact version to be resolvable rather than
      # spending a release on a race.
      - name: Wait for the version to be visible on npm
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          identifier="$(python3 -c 'import json; print(json.load(open("server.json"))["packages"][0]["identifier"])')"
          url="https://registry.npmjs.org/${identifier}/${version}"

          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "$identifier@$version is live on npm (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: $url -> $code; retrying in 10s"
            sleep 10
          done

          echo "::error::$identifier@$version never became visible on npm after 5 minutes. The MCP registry would reject the publish with a 404, so stopping here. Re-run this job once the version resolves."
          exit 1

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish the server
        run: ./mcp-publisher publish
