name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Measurement harness unit tests
        run: |
          python3 -m unittest -v \
            tools.test_core_trustworthiness_oracle \
            tools.test_core_representative_benchmark \
            tools.test_core_representative_mutations \
            tools.test_plan_executor_oracle

      - name: Live provider feature compiles
        run: cargo check -p aether-ai --features live-providers

      - name: Install debugpy adapter
        run: python3 -m pip install debugpy

      - name: DAP debugpy integration test
        run: cargo test -p aether-dap --test debugpy -- --ignored

      - name: Smoke demo runs
        run: cargo run -p aether-app -- demo

      # Compile-only guard for the GUI so it can't silently regress. winit/wgpu
      # dlopen their system libs at runtime, so no -dev packages are needed to
      # type-check; actually *running* the window needs a GPU or software Vulkan.
      - name: GUI compiles
        run: cargo clippy -p aether-app --features gui
