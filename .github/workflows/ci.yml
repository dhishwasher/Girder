name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      - name: Ensure ripgrep is available for measurement tool tests
        run: |
          if ! command -v rg > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi

      - name: Measurement harness unit tests
        run: |
          python3 -m unittest -v \
            tools.test_core_trustworthiness_oracle \
            tools.test_core_representative_benchmark \
            tools.test_core_representative_mutations \
            tools.test_typescript_support_benchmark \
            tools.test_plan_executor_oracle \
            tools.test_context_vs_read_cost \
            tools.test_girder_context_advisory_hook \
            tools.test_description_search_accuracy \
            tools.test_agentic_grep_benchmark

      # `curl … | sh` is the README's first install instruction, so install.sh
      # is how most people will obtain the tool. These run the real script
      # against a synthetic release served from localhost.
      - name: install.sh end-to-end tests
        run: python3 -m unittest -v tools.test_install_sh

      # The npm wrapper is how agent hosts actually launch the MCP server, and
      # it is the one shipped component with no Rust coverage at all.
      - name: npm wrapper unit tests
        run: node --test npm/test/*.test.js

      - name: Live provider feature compiles
        run: cargo check -p aether-ai --features live-providers

      - name: Install debugpy adapter
        run: python3 -m pip install debugpy

      - name: DAP debugpy integration test
        run: cargo test -p aether-dap --test debugpy -- --ignored

      - name: Smoke demo runs
        run: cargo run -p aether-app -- demo

      # Compile-only guard for the GUI so it can't silently regress. winit/wgpu
      # dlopen their system libs at runtime, so no -dev packages are needed to
      # type-check; actually *running* the window needs a GPU or software Vulkan.
      - name: GUI compiles
        run: cargo clippy -p aether-app --features gui

  # The same compile-only idea as the GUI guard above, for the platform this
  # workflow cannot otherwise see. The release workflow builds a Windows
  # binary, but until now nothing checked that one compiles: `libc::pid_t`
  # sat outside its `cfg(unix)` block, and the first `workflow_dispatch` dry
  # run of Release is what found it. That is too late to learn it — `publish`
  # needs every matrix target, so a single uncompilable platform blocks the
  # whole release.
  windows:
    name: windows compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Workspace compiles for Windows
        run: cargo check --workspace --all-targets
