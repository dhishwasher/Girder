name: Verify desktop builds

# Exercise every release platform without creating a tag or publishing assets.
on:
  workflow_dispatch:
  push:
    branches: ["codex/girder-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace and desktop GUI
        run: cargo build --locked --workspace --features aether-app/gui --target ${{ matrix.target }} -j1
      - name: Execute native watcher safety and MCP restart gates
        shell: bash
        run: |
          cargo test --locked -p aether-app --target ${{ matrix.target }} --bin girder project::commands::mcp::watch::tests --quiet -j1 -- --test-threads=1 > watcher-unit.log 2>&1
          cargo test --locked -p aether-app --target ${{ matrix.target }} --test mcp_watch --quiet -j1 -- --test-threads=1 > watcher-mcp.log 2>&1
      - name: Preserve watcher gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-gates-${{ matrix.target }}
          path: watcher-*.log
          if-no-files-found: ignore
